[project]
name = "semg-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "본인이름", email = "GitHub에_등록한_이메일" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "wfdb>=4.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
semg-bench = "semg_bench:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
